<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - Blog</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 4px 4px 0px #111111;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }
    
    /* Layout split per desktop */
    .blog-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .blog-sidebar {
      width: 300px;
      flex-shrink: 0;
    }

    .blog-content-pane {
      flex-grow: 1;
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 4px 4px 0px #111111;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .blog-placeholder-text {
      color: #666;
      font-weight: 700;
      font-size: 0.9rem;
      text-align: center;
    }

    /* Scrollable area */
    .blog-scroll-area { 
      padding: 10px 0; 
      max-height: 550px; 
      overflow-y: auto; 
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Scrollbar style */
    .blog-scroll-area::-webkit-scrollbar {
      width: 8px;
    }
    .blog-scroll-area::-webkit-scrollbar-track {
      background: #f0f0f3;
      border-radius: 4px;
    }
    .blog-scroll-area::-webkit-scrollbar-thumb {
      background: #111111;
      border-radius: 4px;
    }

    .blog-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    /* Clickable Date Button */
    .blog-date-btn {
      font-size: 0.8rem;
      font-weight: 800;
      background: #111;
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      border: 2px solid #111;
      cursor: pointer;
      width: 100%;
      text-align: center;
      box-shadow: 3px 3px 0px #444;
      transition: transform 0.1s ease, background 0.1s ease;
    }

    .blog-date-btn:hover {
      background: #333;
      transform: translateY(-1px);
    }

    .blog-date-btn:active {
      transform: translateY(1px);
      box-shadow: 1px 1px 0px #444;
    }

    /* Blog card container (initially hidden) */
    .blog-card-container {
      display: none;
      width: 100%;
      animation: fadeIn 0.2s ease-in-out;
    }

    .blog-card-container.active {
      display: block;
    }

    /* Blog card image without extra borders/shadows */
    .blog-card-img {
      max-width: 100%;
      width: 100%;
      height: auto;
      max-height: 500px;
      object-fit: contain;
      display: block;
      border: none;
      box-shadow: none;
      filter: none;
      margin: 0 auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Versione Mobile: torna come prima */
    @media (max-width: 768px) {
      .blog-layout {
        flex-direction: column;
      }
      .blog-sidebar {
        width: 100%;
      }
      .blog-content-pane {
        display: none;
        padding: 10px;
        border: none;
        background: transparent;
        box-shadow: none;
        min-height: auto;
      }
      /* Nel telefono il contenitore del post torna sotto al suo bottone */
      .blog-item .blog-card-container {
        margin-top: 5px;
      }
      .blog-item .blog-card-container.active {
        display: block;
      }
    }
  </style>
</head>
<body>

  <div class="site-wrapper">

    <!-- Header with Home button -->
    <header class="top-banner">
      <h1>BLOG</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" style="background:#F3EEDA; color:#111; border:2px solid #111; padding:8px 14px; border-radius:12px; font-weight:800; font-size:0.75rem; text-decoration:none; box-shadow:2px 2px 0px #111;">← HOME</a>
    </header>

    <!-- Layout diviso per Desktop, verticale per Mobile -->
    <div class="blog-layout">
      
      <!-- Sidebar con le date -->
      <div class="blog-sidebar">
        <div class="blog-scroll-area">
          
          <!-- POST 1 (Today) -->
          <div class="blog-item">
            <button class="blog-date-btn" onclick="toggleCard('card-1')">August 28, 2026</button>
            <div id="card-1" class="blog-card-container">
              <img src="blog-01.png" alt="Blog Post 1" class="blog-card-img">
            </div>
          </div>

        </div>
      </div>

      <!-- Finestra a destra per mostrare l'immagine su Desktop -->
      <div class="blog-content-pane" id="content-pane">
        <div class="blog-placeholder-text">Select a date to read the post ✨</div>
      </div>

    </div>

  </div>

  <script>
    // Function to show/hide the card and handle desktop split view
    function toggleCard(cardId) {
      const cardContainer = document.getElementById(cardId);
      const contentPane = document.getElementById('content-pane');
      const isMobile = window.innerWidth <= 768;
      const isAlreadyOpen = cardContainer.classList.contains('active');

      // Close all cards first
      const allCards = document.querySelectorAll('.blog-card-container');
      allCards.forEach(card => card.classList.remove('active'));

      if (isMobile) {
        // Comportamento originale per telefono
        if (!isAlreadyOpen) {
          cardContainer.classList.add('active');
        }
      } else {
        // Comportamento a due colonne per computer
        if (!isAlreadyOpen) {
          cardContainer.classList.add('active');
          // Copia l'immagine del post dentro il pannello di destra
          contentPane.innerHTML = '';
          contentPane.appendChild(cardContainer.cloneNode(true));
          contentPane.querySelector('.blog-card-container').classList.add('active');
        } else {
          // Se si clicca di nuovo sulla stessa data, pulisce il pannello
          contentPane.innerHTML = '<div class="blog-placeholder-text">Select a date to read the post ✨</div>';
        }
      }
    }
  </script>

</body>
</html>
