<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - Blog</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 800px;
      width: 100%;
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 32px;
      padding: 20px;
      box-shadow: 6px 6px 0px #111111;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .box {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #111111;
    }
    
    .box-header-accent {
      background: #F3EEDA;
      border-bottom: 2px solid #111111;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #111111;
    }
    
    .box-body { 
      padding: 20px; 
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Stile per le card-post */
    .blog-card-link {
      display: block;
      text-decoration: none;
      transition: transform 0.15s ease;
    }

    .blog-card-link:hover {
      transform: translateY(-3px);
    }

    .blog-card-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      filter: drop-shadow(4px 4px 0px #111111);
      border: 2px solid #111111;
    }

    .blog-date-tag {
      font-size: 0.75rem;
      font-weight: 800;
      background: #111;
      color: #fff;
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div class="site-wrapper">

    <!-- Header con titolo e tasto Home per tornare indietro nella stessa scheda -->
    <header class="top-banner">
      <h1>BLOG / GAMES</h1>
      <a href="index.html" style="background:#F3EEDA; color:#111; border:2px solid #111; padding:8px 14px; border-radius:12px; font-weight:800; font-size:0.75rem; text-decoration:none; box-shadow:2px 2px 0px #111;">← HOME</a>
    </header>

    <!-- Sezione Post aimmagini (le tue Pocket/Banner Card) -->
    <div class="box">
      <div class="box-header-accent"><span>game reviews & logs</span><span>✐ᝰ</span></div>
      <div class="box-body">
        
        <!-- Post 1: Cliccandoci vai alla pagina del gioco 1 -->
        <div>
          <span class="blog-date-tag">June 7, 2026</span>
          <a href="gioco1.html" class="blog-card-link">
            <img src="tuia-card-gioco1.png" alt="Card Gioco 1" class="blog-card-img">
          </a>
        </div>

        <!-- Post 2: Cliccandoci vai alla pagina del gioco 2 -->
        <div>
          <span class="blog-date-tag">June 1, 2026</span>
          <a href="gioco2.html" class="blog-card-link">
            <img src="tuia-card-gioco2.png" alt="Card Gioco 2" class="blog-card-img">
          </a>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
