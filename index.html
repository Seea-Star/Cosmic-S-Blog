<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - Blog</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 800px;
      width: 100%;
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 32px;
      padding: 20px;
      box-shadow: 6px 6px 0px #111111;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .box {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #111111;
    }
    
    .box-header-accent {
      background: #F3EEDA;
      border-bottom: 2px solid #111111;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #111111;
    }
    
    /* Area scrollabile */
    .blog-scroll-area { 
      padding: 20px; 
      max-height: 550px; 
      overflow-y: auto; 
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Stile barra di scorrimento */
    .blog-scroll-area::-webkit-scrollbar {
      width: 8px;
    }
    .blog-scroll-area::-webkit-scrollbar-track {
      background: #f0f0f3;
      border-radius: 4px;
    }
    .blog-scroll-area::-webkit-scrollbar-thumb {
      background: #111111;
      border-radius: 4px;
    }

    .blog-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    /* Tasto Data cliccabile */
    .blog-date-btn {
      font-size: 0.8rem;
      font-weight: 800;
      background: #111;
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      border: 2px solid #111;
      cursor: pointer;
      width: 100%;
      text-align: center;
      box-shadow: 3px 3px 0px #444;
      transition: transform 0.1s ease, background 0.1s ease;
    }

    .blog-date-btn:hover {
      background: #333;
      transform: translateY(-1px);
    }

    .blog-date-btn:active {
      transform: translateY(1px);
      box-shadow: 1px 1px 0px #444;
    }

    /* Immagine della carta (inizialmente nascosta) */
    .blog-card-container {
      display: none;
      width: 100%;
      animation: fadeIn 0.2s ease-in-out;
    }

    .blog-card-container.active {
      display: block;
    }

    .blog-card-img {
      max-width: 100%;
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      filter: drop-shadow(4px 4px 0px #111111);
      border: 2px solid #111111;
      margin-bottom: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="site-wrapper">

    <!-- Header con tasto Home -->
    <header class="top-banner">
      <h1>BLOG</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" style="background:#F3EEDA; color:#111; border:2px solid #111; padding:8px 14px; border-radius:12px; font-weight:800; font-size:0.75rem; text-decoration:none; box-shadow:2px 2px 0px #111;">← HOME</a>
    </header>

    <!-- Sezione con scorrimento -->
    <div class="box">
      <div class="box-header-accent"><span>posts</span><span>✐ᝰ</span></div>
      <div class="blog-scroll-area">
        
        <!-- POST 2 (Il più recente - In cima) -->
        <div class="blog-item">
          <button class="blog-date-btn" onclick="toggleCard('card-2')">August 27, 2026</button>
          <div id="card-2" class="blog-card-container">
            <img src="post-02.png" alt="Blog Post 2" class="blog-card-img">
          </div>
        </div>

        <!-- POST 1 (Il più vecchio) -->
        <div class="blog-item">
          <button class="blog-date-btn" onclick="toggleCard('card-1')">August 26, 2026</button>
          <div id="card-1" class="blog-card-container">
            <img src="post-01.png" alt="Blog Post 1" class="blog-card-img">
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // Funzione per mostrare/nascondere la carta quando si clicca sulla data
    function toggleCard(cardId) {
      const cardContainer = document.getElementById(cardId);
      const isAlreadyOpen = cardContainer.classList.contains('active');

      // Chiude tutte le altre carte aperte prima (opzionale, ma pulito)
      const allCards = document.querySelectorAll('.blog-card-container');
      allCards.forEach(card => card.classList.remove('active'));

      // Se non era già aperta, la apre
      if (!isAlreadyOpen) {
        cardContainer.classList.add('active');
      }
    }
  </script>

</body>
</html>
