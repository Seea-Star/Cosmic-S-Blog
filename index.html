<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - Blog</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 800px;
      width: 100%;
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 32px;
      padding: 20px;
      box-shadow: 6px 6px 0px #111111;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .box {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #111111;
    }
    
    .box-header-accent {
      background: #F3EEDA;
      border-bottom: 2px solid #111111;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #111111;
    }
    
    /* Area scrollabile per i post */
    .blog-scroll-area { 
      padding: 20px; 
      max-height: 550px; 
      overflow-y: auto; 
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Stile barra di scorrimento */
    .blog-scroll-area::-webkit-scrollbar {
      width: 8px;
    }
    .blog-scroll-area::-webkit-scrollbar-track {
      background: #f0f0f3;
      border-radius: 4px;
    }
    .blog-scroll-area::-webkit-scrollbar-thumb {
      background: #111111;
      border-radius: 4px;
    }

    .blog-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .blog-card-img {
      max-width: 100%;
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      filter: drop-shadow(4px 4px 0px #111111);
      border: 2px solid #111111;
    }

    .blog-date-tag {
      font-size: 0.75rem;
      font-weight: 800;
      background: #111;
      color: #fff;
      padding: 4px 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="site-wrapper">

    <!-- Header con tasto Home -->
    <header class="top-banner">
      <h1>BLOG</h1>
      <a href="index.html" style="background:#F3EEDA; color:#111; border:2px solid #111; padding:8px 14px; border-radius:12px; font-weight:800; font-size:0.75rem; text-decoration:none; box-shadow:2px 2px 0px #111;">← HOME</a>
    </header>

    <!-- Sezione con scorrimento -->
    <div class="box">
      <div class="box-header-accent"><span>thoughts & updates</span><span>✐ᝰ</span></div>
      <div class="blog-scroll-area">
        
        <!-- Post 1 (Esempio) -->
        <div class="blog-item">
          <span class="blog-date-tag">August 27, 2026</span>
          <img src="post-01.png" alt="Blog Post 1" class="blog-card-img">
        </div>

        <!-- Post 2 (Esempio) -->
        <div class="blog-item">
          <span class="blog-date-tag">August 26, 2026</span>
          <img src="post-02.png" alt="Blog Post 2" class="blog-card-img">
        </div>

      </div>
    </div>

  </div>

</body>
</html>
